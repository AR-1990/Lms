name: pinnacle_school
description: School app for parents, students and staff. One app for every school; the user enters the school's address first.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.5
  web_socket_channel: ^3.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
